<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국어 워들</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e17;
      --surface: #1a1929;
      --border: #2e2d45;
      --text: #fffffe;
      --muted: #a7a9be;
      --correct: #2cb67d;
      --present: #e8b84b;
      --absent: #2e2d45;
      --key-bg: #2e2d45;
      --key-text: #fffffe;
      --accent: #7f5af0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 480px;
      padding: 20px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    header h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text);
    }

    header h1 span {
      color: var(--accent);
    }

    #help-btn {
      position: absolute;
      right: 16px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      transition: border-color 0.2s, color 0.2s;
    }
    #help-btn:hover { border-color: var(--accent); color: var(--accent); }

    #message-area {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin: 8px 0 0;
    }

    #board-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
    }

    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .tile {
      width: 54px;
      height: 54px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      border-radius: 4px;
      transition: border-color 0.1s;
      position: relative;
      overflow: hidden;
    }

    .tile.filled { border-color: var(--muted); }

    .tile.correct { background: var(--correct); border-color: var(--correct); color: #fff; }
    .tile.present { background: var(--present); border-color: var(--present); color: #fff; }
    .tile.absent  { background: var(--absent);  border-color: var(--absent);  color: var(--muted); }

    .tile.pop { animation: pop 0.1s ease; }
    .tile.shake { animation: shake 0.4s ease; }
    .tile.flip { animation: flip 0.5s ease forwards; }
    .tile.bounce { animation: bounce 0.5s ease forwards; }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
    }
    @keyframes flip {
      0%   { transform: rotateX(0); }
      50%  { transform: rotateX(-90deg); }
      100% { transform: rotateX(0); }
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      40%     { transform: translateY(-16px); }
      60%     { transform: translateY(-8px); }
    }

    #keyboard {
      width: 100%;
      max-width: 480px;
      padding: 0 8px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .key {
      height: 52px;
      min-width: 36px;
      padding: 0 4px;
      border-radius: 6px;
      background: var(--key-bg);
      border: none;
      color: var(--key-text);
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .key:active { transform: scale(0.95); }
    .key.wide { min-width: 52px; font-size: 12px; }
    .key.correct { background: var(--correct); color: #fff; }
    .key.present { background: var(--present); color: #fff; }
    .key.absent  { background: #1a1929; color: #555; }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #overlay.show { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 32px;
      max-width: 340px;
      width: 90%;
      text-align: center;
    }
    .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .modal p  { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 8px; }
    .modal .answer { font-size: 22px; font-weight: 900; color: var(--accent); margin: 12px 0; letter-spacing: 4px; }

    .example-row { display: flex; gap: 5px; justify-content: center; margin: 12px 0 4px; }
    .ex-tile {
      width: 38px; height: 38px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700;
      border: 2px solid var(--border);
    }
    .ex-tile.correct { background: var(--correct); border-color: var(--correct); color: #fff; }
    .ex-tile.present { background: var(--present); border-color: var(--present); color: #fff; }
    .ex-tile.absent  { background: var(--absent);  border-color: var(--absent);  color: var(--muted); }

    .modal-btn {
      margin-top: 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 15px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .modal-btn:hover { opacity: 0.85; }
    .modal-btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-left: 8px;
    }
    .modal-btn.secondary:hover { border-color: var(--muted); color: var(--text); }

    hr.modal-divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    @media (max-width: 420px) {
      .tile { width: 46px; height: 46px; font-size: 17px; }
      .key { height: 46px; min-width: 30px; font-size: 13px; }
      .key.wide { min-width: 44px; }
    }
  </style>
</head>
<body>

<header>
  <h1>한국어 <span>워들</span></h1>
  <button id="help-btn" aria-label="도움말">?</button>
</header>

<div id="message-area"></div>

<div id="board-container">
  <div id="board"></div>
</div>

<div id="keyboard"></div>

<div id="overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const WORDS = [
  "가족","강물","거울","겨울","고양","공기","구름","그림","기억","나무",
  "나비","노래","눈물","다람","달빛","대화","도시","동물","두부","드라",
  "마음","마을","모래","목소","무지","바다","바람","반딧","방울","봄날",
  "사랑","사막","사슴","산책","새벽","소나","소망","숲속","시간","신발",
  "아침","여름","여행","연기","연습","오후","우리","우산","이슬","이야",
  "자연","장미","저녁","절망","조개","지구","지식","차가","천둥","초록",
  "파도","포기","하늘","행복","호수","화분","희망","가을","겨자","관계",
  "기쁨","노력","단풍","도움","두려","마법","미래","방향","보람","부탁",
  "빛나","사계","새벽","성공","세상","순간","아름","언덕","열정","운명",
  "이별","인생","자유","제목","지혜","진심","차이","청춘","추억","침묵"
];

const HINT_WORDS = {
  "가족":"함께 사는 사람들","강물":"흘러가는 물","거울":"얼굴 보는 것",
  "겨울":"눈 오는 계절","고양":"야옹 하는 동물","공기":"우리가 숨 쉬는 것",
  "구름":"하늘에 뜬 하얀 것","그림":"붓으로 그린 것","기억":"머릿속 추억",
  "나무":"숲에 사는 식물","나비":"꽃에 앉는 곤충","노래":"음악과 가사",
  "눈물":"슬플 때 나오는 것","다람":"쥐 닮은 산 동물","달빛":"달이 비추는 빛",
  "대화":"서로 이야기하기","도시":"사람 많은 곳","동물":"살아 움직이는 생명",
  "마음":"감정이 있는 곳","마을":"작은 지역 공동체","모래":"해변의 작은 알갱이",
  "바다":"넓고 짠 물","바람":"불어오는 공기","반딧":"밤에 빛나는 벌레",
  "방울":"동그랗게 맺힌 것","봄날":"꽃 피는 따뜻한 날","사랑":"가슴 따뜻한 감정",
  "사막":"모래만 있는 건조한 곳","산책":"걸으며 쉬는 것","새벽":"동트기 전 시간",
  "소망":"바라고 원하는 것","숲속":"나무 많은 깊은 곳","시간":"흘러가는 것",
  "아침":"하루의 시작","여름":"더운 계절","여행":"멀리 떠나는 것",
  "연기":"불에서 나오는 것","연습":"반복해서 익히기","오후":"정오 이후",
  "우리":"나와 너 함께","우산":"비 막는 도구","이슬":"아침 풀잎의 물방울",
  "자연":"산 강 하늘","장미":"빨간 꽃의 여왕","저녁":"해 지는 시간",
  "조개":"바닷가 껍데기","지구":"우리가 사는 별","차가":"온도가 낮은","하늘":"위에 있는 파란 것",
  "행복":"기쁘고 만족스러운 것","호수":"육지의 큰 물","화분":"꽃 심는 그릇","희망":"앞날을 기대함",
  "가을":"단풍 드는 계절","관계":"서로의 연결","기쁨":"행복한 감정","노력":"열심히 하기",
  "단풍":"가을 물드는 잎","도움":"남을 돕는 것","마법":"신기한 힘","미래":"앞으로의 시간",
  "방향":"나아가는 쪽","보람":"뿌듯한 느낌","빛나":"밝게 빛남","사계":"봄여름가을겨울",
  "성공":"목표를 이룸","세상":"우리가 사는 곳","순간":"아주 짧은 시간","아름":"예쁘고 좋음",
  "언덕":"작은 산","열정":"뜨겁게 좋아함","운명":"정해진 인생길","이별":"헤어지는 것",
  "인생":"살아가는 여정","자유":"마음대로 하기","지혜":"깊고 밝은 생각","진심":"참된 마음",
  "차이":"서로 다른 점","청춘":"젊은 시절","추억":"지난 기억","침묵":"소리 없는 상태"
};

const KEYBOARD_ROWS = [
  ["ㅂ","ㅈ","ㄷ","ㄱ","ㅅ","ㅛ","ㅕ","ㅑ","ㅐ","ㅔ"],
  ["ㅁ","ㄴ","ㅇ","ㄹ","ㅎ","ㅗ","ㅓ","ㅏ","ㅣ"],
  ["⌫","ㅋ","ㅌ","ㅊ","ㅍ","ㅠ","ㅜ","ㅡ","↵"]
];

let answer, hint, currentRow = 0, currentCol = 0, gameOver = false;
let grid = Array.from({length:6}, () => Array(5).fill(""));
let colors = Array.from({length:6}, () => Array(5).fill(""));
let keyColors = {};
let composing = "";

function pickWord() {
  const w = WORDS[Math.floor(Math.random() * WORDS.length)];
  answer = w;
  hint = HINT_WORDS[w] || "단어를 추측하세요";
}

function buildBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (let r = 0; r < 6; r++) {
    const row = document.createElement("div");
    row.className = "row";
    row.id = `row-${r}`;
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.id = `tile-${r}-${c}`;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

function buildKeyboard() {
  const kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  KEYBOARD_ROWS.forEach(row => {
    const div = document.createElement("div");
    div.className = "kb-row";
    row.forEach(k => {
      const btn = document.createElement("button");
      btn.className = "key" + (k === "⌫" || k === "↵" ? " wide" : "");
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener("click", () => handleKey(k));
      div.appendChild(btn);
    });
    kb.appendChild(div);
  });
}

function setMessage(msg, color) {
  const el = document.getElementById("message-area");
  el.textContent = msg;
  el.style.color = color || "var(--muted)";
}

function getTile(r, c) { return document.getElementById(`tile-${r}-${c}`); }

function updateTile(r, c) {
  const tile = getTile(r, c);
  tile.textContent = grid[r][c];
  if (grid[r][c]) {
    tile.classList.add("filled");
    tile.classList.remove("pop");
    void tile.offsetWidth;
    tile.classList.add("pop");
  } else {
    tile.classList.remove("filled");
    tile.textContent = "";
  }
}

function handleKey(k) {
  if (gameOver) return;
  if (k === "⌫") { deleteLetter(); return; }
  if (k === "↵") { submitGuess(); return; }
  addLetter(k);
}

function addLetter(ch) {
  if (currentCol >= 5) return;
  grid[currentRow][currentCol] = ch;
  updateTile(currentRow, currentCol);
  currentCol++;
}

function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--;
  grid[currentRow][currentCol] = "";
  updateTile(currentRow, currentCol);
}

function submitGuess() {
  if (currentCol < 5) {
    shakeRow(currentRow);
    setMessage("글자를 5개 입력하세요", "var(--present)");
    return;
  }
  const guess = grid[currentRow].join("");
  const result = evaluate(guess, answer);
  colors[currentRow] = result;
  revealRow(currentRow, result, () => {
    updateKeyColors(grid[currentRow], result);
    if (guess === answer) {
      gameOver = true;
      bounceRow(currentRow);
      setTimeout(() => showResult(true), 1200);
    } else {
      currentRow++;
      currentCol = 0;
      if (currentRow >= 6) {
        gameOver = true;
        setTimeout(() => showResult(false), 400);
      }
    }
  });
}

function evaluate(guess, ans) {
  const res = Array(5).fill("absent");
  const ansArr = ans.split("");
  const used = Array(5).fill(false);
  for (let i = 0; i < 5; i++) {
    if (guess[i] === ansArr[i]) { res[i] = "correct"; used[i] = true; }
  }
  for (let i = 0; i < 5; i++) {
    if (res[i] === "correct") continue;
    for (let j = 0; j < 5; j++) {
      if (!used[j] && guess[i] === ansArr[j]) { res[i] = "present"; used[j] = true; break; }
    }
  }
  return res;
}

function revealRow(r, result, cb) {
  const DELAY = 300;
  result.forEach((color, c) => {
    setTimeout(() => {
      const tile = getTile(r, c);
      tile.classList.add("flip");
      setTimeout(() => { tile.classList.add(color); }, 150);
    }, c * DELAY);
  });
  setTimeout(cb, 5 * DELAY + 300);
}

function shakeRow(r) {
  const row = document.getElementById(`row-${r}`);
  row.classList.remove("shake");
  void row.offsetWidth;
  row.classList.add("shake");
}

function bounceRow(r) {
  for (let c = 0; c < 5; c++) {
    setTimeout(() => {
      const tile = getTile(r, c);
      tile.classList.add("bounce");
    }, c * 80);
  }
}

function updateKeyColors(letters, result) {
  const priority = {correct:3, present:2, absent:1};
  letters.forEach((ch, i) => {
    const cur = keyColors[ch];
    if (!cur || priority[result[i]] > priority[cur]) keyColors[ch] = result[i];
  });
  document.querySelectorAll(".key").forEach(btn => {
    const k = btn.dataset.key;
    if (keyColors[k]) {
      btn.classList.remove("correct","present","absent");
      btn.classList.add(keyColors[k]);
    }
  });
}

function showResult(won) {
  const modal = document.getElementById("modal-content");
  const tries = currentRow + (won ? 1 : 0);
  modal.innerHTML = won
    ? `<h2>🎉 정답!</h2>
       <p style="font-size:24px;font-weight:900;color:var(--correct);letter-spacing:4px;margin:12px 0">${answer}</p>
       <p>${tries}번 만에 맞추셨어요!</p>
       <p style="margin-top:8px;color:var(--muted)">힌트: ${hint}</p>
       <button class="modal-btn" onclick="newGame()">다시 시작</button>`
    : `<h2>😢 아쉬워요</h2>
       <p>정답은:</p>
       <div class="answer">${answer}</div>
       <p style="color:var(--muted)">힌트: ${hint}</p>
       <button class="modal-btn" onclick="newGame()">다시 시작</button>`;
  document.getElementById("overlay").classList.add("show");
}

function showHelp() {
  const modal = document.getElementById("modal-content");
  modal.innerHTML = `
    <h2>게임 방법</h2>
    <p>5글자 한국어 단어를 6번 안에 맞추세요!</p>
    <hr class="modal-divider">
    <p style="text-align:left;font-size:13px;margin-bottom:6px">각 글자의 색상:</p>
    <div class="example-row">
      <div class="ex-tile correct">사</div><div class="ex-tile">랑</div><div class="ex-tile">해</div><div class="ex-tile">요</div><div class="ex-tile">!</div>
    </div>
    <p style="font-size:13px;color:var(--correct);margin-bottom:10px">🟢 <b>초록</b> = 정확한 위치</p>
    <div class="example-row">
      <div class="ex-tile">사</div><div class="ex-tile present">랑</div><div class="ex-tile">해</div><div class="ex-tile">요</div><div class="ex-tile">!</div>
    </div>
    <p style="font-size:13px;color:var(--present);margin-bottom:10px">🟡 <b>노랑</b> = 단어에 있지만 위치 틀림</p>
    <div class="example-row">
      <div class="ex-tile">사</div><div class="ex-tile">랑</div><div class="ex-tile absent">해</div><div class="ex-tile">요</div><div class="ex-tile">!</div>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px">⬛ <b>회색</b> = 단어에 없음</p>
    <hr class="modal-divider">
    <p style="font-size:12px;color:var(--muted)">키보드로 자음/모음을 조합해 입력하세요</p>
    <button class="modal-btn" onclick="closeOverlay()">시작하기</button>`;
  document.getElementById("overlay").classList.add("show");
}

function closeOverlay() {
  document.getElementById("overlay").classList.remove("show");
}

function newGame() {
  closeOverlay();
  currentRow = 0; currentCol = 0; gameOver = false;
  grid = Array.from({length:6}, () => Array(5).fill(""));
  colors = Array.from({length:6}, () => Array(5).fill(""));
  keyColors = {};
  composing = "";
  pickWord();
  buildBoard();
  buildKeyboard();
  setMessage(`힌트: ${hint}`);
}

document.getElementById("help-btn").addEventListener("click", showHelp);
document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target === document.getElementById("overlay") && !gameOver) closeOverlay();
});

document.addEventListener("keydown", (e) => {
  if (gameOver) return;
  const k = e.key;
  if (k === "Backspace") { handleKey("⌫"); return; }
  if (k === "Enter") { handleKey("↵"); return; }
  const hangul = "ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎㅏㅐㅑㅒㅓㅔㅕㅖㅗㅛㅜㅠㅡㅣ";
  if (hangul.includes(k)) { handleKey(k); }
});

window.newGame = newGame;
window.closeOverlay = closeOverlay;
newGame();
</script>
</body>
</html>
